[package]
name = "cosmic-screenshot-translation"
version = "1.11.0"
edition = "2024"
description = "Vendor-neutral machine translation behind a small trait (local NLLB default)"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
serde_json = "1"
